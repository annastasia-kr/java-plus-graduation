spring:
  application:
    name: request-service

  config:
    import: "configserver:"

  cloud:
    config:
      # не загружать другие компоненты, до получения конфигурации
      fail-fast: true
      # если config-server недоступен - делать несколько попыток подключиться
      retry:
        # используем случайный backoff между попытками
        useRandomPolicy: true
        # максимальный интервал в течении которого делаем попытки (6000 миллисекунд = 6 сек)
        max-interval: 6000
      discovery:
        enabled: true
        serviceId: config-server
    openfeign:
      okhttp:
        enabled: true
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

logging:
  level:
    root: DEBUG
    org.springframework.web: TRACE
    org.springframework.cloud: TRACE
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE
    feign: DEBUG
    com.netflix.discovery: DEBUG