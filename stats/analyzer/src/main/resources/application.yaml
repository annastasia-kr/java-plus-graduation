spring:
  application:
    name: analyzer

  config:
    import: "configserver:"

  cloud:
    config:
      # не загружать другие компоненты, до получения конфигурации
      fail-fast: true
      # если config-server недоступен - делать несколько попыток подключиться
      retry:
        # используем случайный backoff между попытками
        useRandomPolicy: true
        # максимальный интервал в течении которого делаем попытки (6000 миллисекунд = 6 сек)
        max-interval: 6000
      discovery:
        enabled: true
        serviceId: config-server

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/stats-db
    username: postgres
    password: 12345

    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public

    generate-ddl: false

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: false


grpc:
  server:
    port: 0

eureka:
  client:
    serviceUrl:
      defaultZone: http://${eureka.instance.hostname:localhost}:${eureka.instance.port:8761}/eureka/
  instance:
    preferIpAddress: true
    instance-id: "${spring.application.name}:${random.value}"

