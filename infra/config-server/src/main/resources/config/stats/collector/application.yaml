spring:
  application:
    name: collector
grpc:
  server:
    port: 0

collector:
  kafka:
    properties:
      bootstrap.servers: localhost:9092
      key.serializer: org.apache.kafka.common.serialization.LongSerializer
      value.serializer: ru.practicum.kafka.serializer.GeneralAvroSerializer
    topics:
      stats-user-action-v1: stats.user-actions.v1
      stats-events-similarity-v1: stats.events-similarity.v1