spring:
  application:
    name: analyzer
  datasource:
    url: jdbc:postgresql://localhost:5432/analyzer-db
    username: postgres
    password: 12345
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always

logging:
  level:
    org.springframework.orm.jpa: INFO
    org.springframework.transaction: INFO
    org.springframework.transaction.interceptor: TRACE
    org.springframework.orm.jpa.JpaTransactionManager: DEBUG

grpc:
  client:
    analyzer:
      address: 'discovery:///analyzer'
      enableKeepAlive: true
      keepAliveWithoutCalls: true
      negotiationType: plaintext
  server:
    port: 0
analyzer:
  kafka:
    action-consumer-properties:
      bootstrap.servers: localhost:9092
      group.id: analyzer-group-id
      key.deserializer: org.apache.kafka.common.serialization.LongDeserializer
      value.deserializer: ru.practicum.kafka.serializer.UserActionDeserializer
      max.poll.records: 100
    similarity-properties:
      bootstrap.servers: localhost:9092
      group.id: analyzer-group-id
      key.deserializer: org.apache.kafka.common.serialization.LongDeserializer
      value.deserializer: ru.practicum.kafka.serializer.EventSimilarityDeserializer
      max.poll.records: 100
    topics:
      user-actions: stats.user-actions.v1
      events-similarity: stats.events-similarity.v1

server:
  port: 8081