spring:
  cloud:
    gateway:
      discovery.locator.enabled: true
      routes:
        - id: admin_category
          uri: lb://main-service
          predicates:
            - Path=/admin/categories/**

        - id: public_category
          uri: lb://main-service
          predicates:
            - Path=/categories/**

        - id: admin_compilation
          uri: lb://main-service
          predicates:
            - Path=/admin/compilations/**

        - id: public_compilation
          uri: lb://main-service
          predicates:
            - Path=/compilations/**

        - id: public_event
          uri: lb://main-service
          predicates:
            - Path=/events/**

        - id: admin_event
          uri: lb://main-service
          predicates:
            - Path=/admin/events/**

        - id: private_event
          uri: lb://main-service
          predicates:
            - Path=/users/{userId}/events/**

        - id: private_request
          uri: lb://main-service
          predicates:
            - Path=/users/{userId}/requests/**

        - id: admin_user
          uri: lb://main-service
          predicates:
            - Path=/admin/users/**

server:
  port: 8080


