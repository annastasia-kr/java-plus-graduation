services:

  events-db:
    image: postgres:16.1
    container_name: events-db
    ports:
      - "6542:5432"
    environment:
      POSTGRES_DB: events-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345

  users-db:
    image: postgres:16.1
    container_name: users-db
    ports:
      - "6544:5432"
    environment:
      POSTGRES_DB: users-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345

  requests-db:
    image: postgres:16.1
    container_name: requests-db
    ports:
      - "6545:5432"
    environment:
      POSTGRES_DB: requests-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345

  stats-db:
    image: postgres:16.1
    container_name: stats-db
    ports:
      - "6543:5432"
    environment:
      POSTGRES_DB: stats-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345